<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高数老师看板</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e0ea;
      --panel: #ffffff;
      --page: #f3f6fa;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --soft: #eaf1ff;
      --warm: #fff4ed;
      --warn: #9a3412;
      --good: #18794e;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.55;
    }
    button, input { font: inherit; }
    button {
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      min-height: 42px;
      padding: 0 16px;
      cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button.secondary { background: var(--soft); color: var(--brand-dark); }
    button:disabled { cursor: default; opacity: .5; }
    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px 18px 48px;
    }
    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .page-head > div { min-width: 0; }
    .board-exit {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 12px;
      background: var(--soft);
      color: var(--brand-dark);
      font-size: 13px;
    }
    .board-exit:hover { background: #dbe8ff; color: #1e40af; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 2px; font-size: clamp(22px, 5vw, 32px); }
    h2 { margin-bottom: 12px; font-size: 19px; }
    h3 { margin-bottom: 8px; font-size: 16px; }
    .subtitle, .muted { color: var(--muted); }
    .subtitle { margin-bottom: 0; font-size: 14px; }
    .notice {
      margin-bottom: 16px;
      padding: 11px 13px;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      background: #fff7ed;
      color: var(--warn);
      overflow-wrap: anywhere;
    }
    .notice.ok {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: var(--good);
    }
    .connection-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 11px 13px;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e3a8a;
      overflow-wrap: anywhere;
    }
    .connection-status.ready {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: var(--good);
    }
    .spinner {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border: 2px solid #bfdbfe;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .connection-status.ready .spinner {
      border-color: var(--good);
      border-top-color: var(--good);
      animation: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .notice-row .notice { flex: 1 1 320px; margin-bottom: 0; }
    .hidden { display: none !important; }
    .panel {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }
    .loading-skeleton { display: grid; gap: 16px; }
    #dashboard-section.loading > *:not(.loading-skeleton) { display: none; }
    #dashboard-section:not(.loading) > .loading-skeleton { display: none; }
    .skeleton-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .skeleton-block {
      min-height: 116px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(90deg, #e8edf3 25%, #f5f7fa 45%, #e8edf3 65%);
      background-size: 240% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .skeleton-block.wide { grid-column: 1 / -1; min-height: 170px; }
    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }
    .entry-grid, .create-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .create-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    label {
      display: grid;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
    }
    input {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
    }
    input:focus { outline: 2px solid #bfdbfe; border-color: var(--brand); }
    .actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    .link-button {
      min-height: 28px;
      padding: 0;
      background: transparent;
      color: var(--brand-dark);
      text-decoration: underline;
    }
    .link-button:hover { background: transparent; color: #1e40af; }
    .create-toggle { margin-top: 12px; font-size: 13px; }
    .student-card {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
    }
    .card-line {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      min-width: 0;
      margin-bottom: 8px;
    }
    .card-label { color: var(--muted); font-size: 13px; }
    .card-value {
      min-width: 0;
      padding: 7px 9px;
      border-radius: 8px;
      background: #fff;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .card-copy { min-height: 34px; padding: 0 11px; }
    .copy-whole {
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      border: 1px dashed #93c5fd;
      border-radius: 10px;
      background: rgba(255, 255, 255, .75);
      overflow-wrap: anywhere;
    }
    .class-id {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .class-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .class-name { font-size: 17px; font-weight: 700; }
    .headline {
      margin-bottom: 8px;
      font-size: clamp(22px, 4.2vw, 34px);
      line-height: 1.25;
      letter-spacing: -.02em;
    }
    .next-action {
      margin-bottom: 0;
      padding: 11px 13px;
      border-left: 4px solid var(--brand);
      border-radius: 0 9px 9px 0;
      background: var(--soft);
      color: #1e3a8a;
      font-weight: 700;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }
    .metric span { display: block; color: var(--muted); font-size: 13px; }
    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: clamp(24px, 5vw, 34px);
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .section-head h2 { margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--warm);
      color: var(--warn);
      overflow-wrap: anywhere;
    }
    .missing-callout {
      margin: -2px 0 12px;
      padding: 9px 11px;
      border-radius: 9px;
      background: #fff7ed;
      color: var(--warn);
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .submission-control {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      cursor: pointer;
    }
    .submission-control input {
      width: 17px;
      min-width: 17px;
      height: 17px;
      min-height: 17px;
      margin: 0;
      accent-color: var(--brand);
    }
    .submission-control input:disabled {
      cursor: default;
    }
    .submission-source {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 11px;
      line-height: 1.5;
      white-space: nowrap;
    }
    .submission-source.manual {
      background: #ecfdf3;
      color: #067647;
    }
    .submission-source.auto {
      background: #eff6ff;
      color: #1d4ed8;
    }
    .toast {
      position: fixed;
      z-index: 20;
      right: 20px;
      bottom: 20px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 11px 14px;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      background: #ecfdf3;
      color: #065f46;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .16);
      overflow-wrap: anywhere;
    }
    .toast.toast-error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }
    .empty {
      margin: 0;
      padding: 22px 10px;
      text-align: center;
      color: var(--muted);
    }
    .table-wrap {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #e8edf3;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th { color: var(--muted); font-size: 13px; font-weight: 600; }
    .num { text-align: right; }
    .advice { color: #344054; }
    .dashboard-actions { justify-content: flex-end; margin-top: 16px; }
    @media (max-width: 820px) {
      .create-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .skeleton-metrics, .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .skeleton-grid { grid-template-columns: minmax(0, 1fr); }
      .skeleton-block.wide { grid-column: auto; }
    }
    @media (max-width: 640px) {
      .page-head { gap: 8px; align-items: flex-start; }
      .board-exit { min-height: 32px; padding: 0 10px; }
    }
    @media (max-width: 620px) {
      .page { padding: 16px 12px 34px; }
      .panel { padding: 14px; border-radius: 13px; }
      .entry-grid, .create-grid { grid-template-columns: minmax(0, 1fr); }
      .card-line { grid-template-columns: 55px minmax(0, 1fr); }
      .card-copy { grid-column: 2; justify-self: start; }
      .responsive-table thead { display: none; }
      .responsive-table, .responsive-table tbody,
      .responsive-table tr, .responsive-table td { display: block; width: 100%; }
      .responsive-table tr {
        margin-bottom: 10px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .responsive-table td {
        display: grid;
        grid-template-columns: minmax(76px, 32%) minmax(0, 1fr);
        gap: 8px;
        padding: 6px 0;
        border: 0;
        text-align: left;
      }
      .responsive-table td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div>
        <h1>老师入口</h1>
        <p class="subtitle">不用注册，拿班级码和口令直接进班</p>
      </div>
      <button type="button" id="exit-board" class="board-exit" title="退出看板，回到本地系统">退出</button>
    </header>

    <div id="connection-status" class="connection-status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="connection-text">正在连接服务器…（免费实例首次唤醒可能需要 30–60 秒，请勿关闭页面）</span>
    </div>

    <div class="notice-row">
      <p id="notice" class="notice" role="status" aria-live="polite">先填老师给你的班级码</p>
      <button id="retry-action" class="secondary hidden" type="button">重试</button>
    </div>

    <section id="entry-section" class="panel">
      <h2>进班</h2>
      <form id="entry-form">
        <div class="entry-grid">
          <label>班级码
            <input id="entry-code" type="text" autocomplete="off" placeholder="例如 F34F05" required>
          </label>
          <label>口令
            <input id="entry-secret" type="password" autocomplete="current-password" placeholder="老师给的口令" required>
          </label>
        </div>
        <div class="actions">
          <button id="entry-submit" type="submit">进班</button>
        </div>
      </form>
      <div class="create-toggle">
        <button id="show-create" class="link-button" type="button">第一次用？30 秒建一个班</button>
      </div>
    </section>

    <section id="create-section" class="panel hidden">
      <h2>建班</h2>
      <form id="create-form">
        <div class="create-grid">
          <label>班级码
            <input id="create-code" type="text" autocomplete="off" placeholder="4–12 位大写字母数字" required>
          </label>
          <label>班级名
            <input id="create-class-name" type="text" autocomplete="organization" placeholder="例如 高数A班" required>
          </label>
          <label>你的名字
            <input id="create-teacher-name" type="text" autocomplete="name" placeholder="例如 王老师" required>
          </label>
          <label>设一个口令（4–32 位）
            <input id="create-secret" type="password" autocomplete="new-password" minlength="4" maxlength="32" placeholder="4–32 位" required>
          </label>
        </div>
        <div class="actions">
          <button id="create-submit" type="submit">建班</button>
          <button id="hide-create" class="secondary" type="button">收起</button>
        </div>
      </form>

      <div id="student-card" class="student-card hidden">
        <h3>发给学生的小卡片</h3>
        <div class="card-line">
          <span class="card-label">网址</span>
          <span id="card-url" class="card-value"></span>
          <button class="card-copy secondary" type="button" data-copy-target="card-url">复制</button>
        </div>
        <div class="card-line">
          <span class="card-label">班级码</span>
          <span id="card-code" class="card-value"></span>
          <button class="card-copy secondary" type="button" data-copy-target="card-code">复制</button>
        </div>
        <div class="card-line">
          <span class="card-label">口令</span>
          <span id="card-secret" class="card-value"></span>
          <button class="card-copy secondary" type="button" data-copy-target="card-secret">复制</button>
        </div>
        <div id="card-whole" class="copy-whole"></div>
        <div class="actions">
          <button id="copy-whole" class="secondary" type="button">整段复制</button>
        </div>
      </div>
    </section>

    <section id="dashboard-section" class="hidden" aria-live="polite">
      <div class="loading-skeleton" role="status" aria-label="正在加载看板">
        <div class="skeleton-metrics">
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
        </div>
        <div class="skeleton-grid">
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
          <div class="skeleton-block wide"></div>
        </div>
      </div>

      <section class="panel">
        <div class="class-id">
          <div>
            <div id="board-class-name" class="class-name"></div>
            <div id="board-class-meta" class="muted"></div>
          </div>
          <div class="class-actions">
            <button id="copy-class-secret" class="secondary" type="button">复制口令</button>
            <button id="refresh-board" type="button">刷新看板</button>
          </div>
        </div>
        <p id="headline" class="headline"></p>
        <p id="next-action" class="next-action"></p>
      </section>

      <div class="metrics" aria-label="班级统计">
        <div class="metric"><span>已交</span><strong id="stat-submitted">0</strong></div>
        <div class="metric"><span>名单</span><strong id="stat-roster">0</strong></div>
        <div class="metric"><span>未交</span><strong id="stat-missing">0</strong></div>
        <div class="metric"><span>总作答</span><strong id="stat-attempts">0</strong></div>
      </div>

      <section class="panel">
        <div class="section-head">
          <h2>未交名单</h2>
          <button id="copy-missing" class="secondary" type="button" disabled>复制未交名单</button>
        </div>
        <p id="missing-callout" class="missing-callout hidden"></p>
        <p id="missing-empty" class="empty">先填老师给你的班级码</p>
        <div id="missing-chips" class="chips hidden"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>每个人的情况</h2>
          <button id="toggle-students" class="secondary hidden" type="button">展开全部</button>
        </div>
        <p id="students-empty" class="empty">先填老师给你的班级码</p>
        <div id="students-wrap" class="table-wrap hidden">
          <table class="responsive-table students-table">
            <thead>
              <tr><th>学号</th><th>姓名</th><th>已交</th><th>作答</th><th>正确率</th><th>建议</th></tr>
            </thead>
            <tbody id="students-body"></tbody>
          </table>
        </div>
      </section>

    </section>
  </main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/static/teacher.js"></script>
</body>
</html>
