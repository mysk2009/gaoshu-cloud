<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高数课堂看板</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e0ea;
      --panel: #ffffff;
      --page: #f3f6fa;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --soft: #eaf1ff;
      --warn: #b54708;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.5;
    }
    button, input { font: inherit; }
    button {
      border: 0;
      border-radius: 9px;
      background: var(--brand);
      color: #fff;
      min-height: 40px;
      padding: 0 16px;
      cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button.secondary { background: var(--soft); color: var(--brand-dark); }
    button:disabled { cursor: default; opacity: .55; }
    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px 18px 42px;
    }
    .hero {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); }
    .subtitle { color: var(--muted); margin: 4px 0 0; }
    .auth, .class-picker {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input {
      min-width: 0;
      width: 210px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
    }
    .notice {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #fff7ed;
      color: var(--warn);
    }
    .notice-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .notice-actions .notice { flex: 1 1 320px; margin-bottom: 0; }
    .notice.hidden, .hidden { display: none !important; }
    .loading-skeleton { display: grid; gap: 16px; }
    #dashboard:not(.loading) .loading-skeleton { display: none; }
    #dashboard.loading .metrics,
    #dashboard.loading .conclusion,
    #dashboard.loading .grid { display: none; }
    .conclusion {
      margin: 0 0 16px;
      padding: 17px 18px;
      border: 1px solid #bfdbfe;
      border-left: 5px solid var(--brand);
      border-radius: 14px;
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 72%);
      box-shadow: 0 8px 24px rgba(37, 99, 235, .08);
    }
    .conclusion-headline {
      margin: 0;
      color: #172554;
      font-size: clamp(19px, 3vw, 24px);
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .conclusion-action {
      margin: 6px 0 0;
      color: #1e40af;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .wake-hint {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e3a8a;
      overflow-wrap: anywhere;
    }
    .spinner {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border: 2px solid #bfdbfe;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skeleton-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .skeleton-block {
      min-height: 116px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(90deg, #e8edf3 25%, #f5f7fa 45%, #e8edf3 65%);
      background-size: 240% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .skeleton-block.wide { grid-column: 1 / -1; min-height: 170px; }
    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }
    .metric span { display: block; color: var(--muted); font-size: 13px; }
    .metric strong { display: block; margin-top: 4px; font-size: clamp(24px, 5vw, 34px); }
    .grid {
      display: grid;
      align-items: start;
      grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr);
      gap: 16px;
    }
    .panel {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }
    .panel.wide { grid-column: 1 / -1; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    h2 { margin: 0; font-size: 18px; }
    .empty {
      margin: 0;
      padding: 28px 12px;
      text-align: center;
      color: var(--muted);
    }
    .missing-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .missing-list li {
      padding: 7px 10px;
      border-radius: 8px;
      background: #fff4ed;
      color: #9a3412;
      overflow-wrap: anywhere;
    }
    .missing-callout {
      margin: -2px 0 12px;
      padding: 9px 11px;
      border-radius: 9px;
      background: #fff7ed;
      color: #9a3412;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .submission-control {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      cursor: pointer;
    }
    .submission-control input {
      width: 17px;
      min-width: 17px;
      height: 17px;
      min-height: 17px;
      margin: 0;
      accent-color: var(--brand);
    }
    .submission-control input:disabled {
      cursor: default;
    }
    .submission-source {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 11px;
      line-height: 1.5;
      white-space: nowrap;
    }
    .submission-source.manual {
      background: #ecfdf3;
      color: #067647;
    }
    .submission-source.auto {
      background: #eff6ff;
      color: #1d4ed8;
    }
    .toast {
      position: fixed;
      z-index: 20;
      right: 20px;
      bottom: 20px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 11px 14px;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      background: #ecfdf3;
      color: #065f46;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .16);
      overflow-wrap: anywhere;
    }
    .toast.toast-error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }
    .table-wrap {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid #e8edf3;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    /* 数字列统一右对齐 + 等宽数字，避免长短不齐看起来歪 */
.students-table th:nth-child(3), .students-table td:nth-child(3),
.students-table th:nth-child(4), .students-table td:nth-child(4),
.students-table th:nth-child(5), .students-table td:nth-child(5) {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.review-table th:not(:nth-child(2)):not(:nth-child(9)),
.review-table td:not(:nth-child(2)):not(:nth-child(9)) {
  font-variant-numeric: tabular-nums;
}
th { color: var(--muted); font-size: 13px; font-weight: 600; }
    .num { text-align: right; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 760px) {
      .hero { align-items: stretch; flex-direction: column; }
      .auth, .class-picker { width: 100%; }
      .auth input, .class-picker input { flex: 1 1 180px; width: auto; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .skeleton-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .skeleton-grid { grid-template-columns: minmax(0, 1fr); }
      .grid { grid-template-columns: minmax(0, 1fr); }
      .panel.wide { grid-column: auto; }
    }
    @media (max-width: 600px) {
      .page { padding: 16px 12px 32px; }
      .panel { padding: 13px; }
      .students-table { min-width: 680px; }
      .review-table { min-width: 980px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1>高数课堂看板</h1>
        <p class="subtitle">提交进度与逐人情况</p>
      </div>
      <form id="login-form" class="auth">
        <input id="login-code" type="text" autocomplete="off" placeholder="班级码，如 F34F05" aria-label="班级码" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="管理口令" aria-label="管理口令" required>
        <button id="login-submit" type="submit">进入看板</button>
      </form>
      <form id="class-form" class="class-picker hidden">
        <input id="class-code" type="text" autocomplete="off" placeholder="班级码，如 F34F05" aria-label="班级码">
        <button type="submit">刷新看板</button>
        <button id="logout" class="secondary" type="button">退出</button>
      </form>
    </header>

    <div class="notice-actions">
      <p id="notice" class="notice">输入班级码和管理口令</p>
      <button id="board-retry" class="secondary hidden" type="button">重试</button>
    </div>

    <section id="dashboard" class="loading" aria-live="polite">
      <div class="loading-skeleton" role="status" aria-label="正在加载看板">
        <div class="wake-hint">
          <span class="spinner" aria-hidden="true"></span>
          <span>正在连接服务器…（启动可能需要等一会儿，请勿关闭页面）</span>
        </div>
        <div class="skeleton-metrics">
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
        </div>
        <div class="skeleton-grid">
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
          <div class="skeleton-block wide"></div>
        </div>
      </div>
      <section id="conclusion" class="conclusion hidden" aria-label="本班结论">
        <p id="headline" class="conclusion-headline"></p>
        <p id="next-action" class="conclusion-action"></p>
      </section>
      <div class="metrics">
        <div class="metric"><span>已交</span><strong id="submitted">0</strong></div>
        <div class="metric"><span>名单</span><strong id="roster">0</strong></div>
        <div class="metric"><span>未交</span><strong id="missing-count">0</strong></div>
        <div class="metric"><span>总作答</span><strong id="attempts">0</strong></div>
      </div>

      <div class="grid">
        <section class="panel">
          <div class="panel-head">
            <h2>未交名单</h2>
            <button id="copy-missing" class="secondary" type="button" disabled>复制未交名单</button>
          </div>
          <p id="missing-callout" class="missing-callout hidden"></p>
          <p id="missing-empty" class="empty">输入班级码</p>
          <ul id="missing-list" class="missing-list"></ul>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>逐人明细</h2>
            <button id="reset-submissions" class="secondary hidden" type="button" title="把全班重置为未交（历史作答保留，只清提交状态）">重置全部提交</button>
            <button id="toggle-students" class="secondary hidden" type="button">展开全部</button>
          </div>
          <p id="students-empty" class="empty">输入班级码</p>
          <div id="students-wrap" class="table-wrap hidden">
            <table class="responsive-table students-table">
              <colgroup>
                <col style="width: 14%">
                <col style="width: 18%">
                <col style="width: 12%">
                <col style="width: 12%">
                <col style="width: 14%">
                <col style="width: 24%">
              </colgroup>
              <thead><tr><th>学号</th><th>姓名</th><th>已交</th><th>作答</th><th>正确率</th><th>建议</th></tr></thead>
              <tbody id="students-body"></tbody>
            </table>
          </div>
        </section>

      </div>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/board.js"></script>
</body>
</html>
